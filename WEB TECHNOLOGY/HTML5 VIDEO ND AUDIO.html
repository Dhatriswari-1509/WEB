<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My first video & audio</title>
</head>
<body>
    <h1> my video</h1>
    <video
        controls
        width="500"
        height="300"
        autoplay
        muted
        loop>
        <source src="video.mp4" type="video/mp4">
    </video>

<h1>my music</h1>
<audio 
    controls
    autoplay
    loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

</body>
</html>
