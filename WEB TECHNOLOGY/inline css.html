<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inline css</title>
</head>
<body>
    <h1 style="color: rgb(82, 159, 226); text-align: center;">My website</h1>


    <!--the style is applied directly to this paragraph -->
    <p style="color: rgb(198, 121, 205); font-size: 20px;">
          this is an example of inline css.
    </p>

    <!--another element with its own style-->
    <button style="background-color: black; color: rgb(246, 249, 251);">
        click me
    </button>
</body>
</html>
